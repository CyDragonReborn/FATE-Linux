name: Validate native Linux platform

on:
  push:
    branches: [ main, native-port ]
  workflow_dispatch:

jobs:
  build-native-platform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build and test SDL3/OpenGL platform in Arch Linux
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/work/src \
            -w /work/src \
            archlinux:latest /bin/bash -lc '
              set -euo pipefail
              pacman -Syu --noconfirm --needed base-devel cmake ninja sdl3 mesa libgl
              bash fate_tools/build.sh
            '

      - name: Upload platform demo (not the full game)
        uses: actions/upload-artifact@v4
        with:
          name: fate-native-platform-demo
          path: build/native/bin/fate-platform-demo
          if-no-files-found: error
