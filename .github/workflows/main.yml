name: Validate native Linux platform

on:
  push:
    branches: [ main, native-port ]
  workflow_dispatch:

jobs:
  build-native-platform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build SDL3 and OpenGL platform targets in Arch Linux
        run: |
          docker run --rm \
            -v "${{ github.workspace }}":/work/src \
            -w /work/src \
            archlinux:latest /bin/bash -lc "\
              set -euo pipefail; \
              pacman -Sy --noconfirm --needed base-devel cmake gcc pkgconf ninja sdl3 mesa libpng libjpeg-turbo && \
              cmake -S . -B /tmp/fate-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DFATE_BUILD_FMOD_COMPAT=OFF && \
              cmake --build /tmp/fate-build --parallel"
